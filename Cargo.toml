[package]
name = "agentplug-libsql"
version = "0.1.1"
edition = "2021"

[lib]
name = "agentplug_libsql"
path = "src/lib.rs"
crate-type = ["cdylib"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"

[dependencies]
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
libsql-ffi = { version = "=0.9.30", default-features = false, features = ["wasm32-wasi-vfs"] }
