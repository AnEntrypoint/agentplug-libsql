name: release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: agentplug-libsql-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: AnEntrypoint/rs-plugkit/.github/workflows/wasm-plugin-release.yml@main
    with:
      wasm_artifact_name: agentplug_libsql.wasm
      published_asset_basename: libsql
      release_repo: AnEntrypoint/agentplug-libsql-bin
      release_title_prefix: agentplug-libsql
      pre_build_steps: |
        curl -L -o wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-24/wasi-sdk-24.0-x86_64-linux.tar.gz
        tar xzf wasi-sdk.tar.gz
        echo "WASI_SDK_PATH=$PWD/wasi-sdk-24.0-x86_64-linux" >> "$GITHUB_ENV"
      build_env: |
        export CC_wasm32_wasip1="$WASI_SDK_PATH/bin/clang"
        export CFLAGS_wasm32_wasip1="--sysroot=$WASI_SDK_PATH/share/wasi-sysroot -DLONGDOUBLE_TYPE=double -DSQLITE_OMIT_LOAD_EXTENSION -DSQLITE_MAX_MMAP_SIZE=0 -DSQLITE_DEFAULT_MMAP_SIZE=0 -DSQLITE_THREADSAFE=0 -DSQLITE_TEMP_STORE=3 -DHAVE_FDATASYNC=0 -DHAVE_POSIX_FALLOCATE=0 -DHAVE_PREAD=0 -DHAVE_PWRITE=0 -DPROT_READ=1 -DPROT_WRITE=2 -DMAP_SHARED=1 -DMAP_FAILED=((void*)-1) -DMAP_PRIVATE=2 -Wno-error=implicit-function-declaration -Wno-error=int-conversion"
      build_command: cargo build --release --target wasm32-wasip1
    secrets:
      publisher_token: ${{ secrets.PUBLISHER_TOKEN }}
